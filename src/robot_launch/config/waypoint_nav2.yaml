base_to_livox_tf:
  ros__parameters:
    use_sim_time: true

base_to_odom_tf:
  ros__parameters:
    use_sim_time: true

nav2_log_record:
  ros__parameters:
    log_output: both
    log_level: info

waypoint_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    goal_xy_tolerance: 0.3
    robot_path_dis_thd: 30.0
    controller_id: FollowPath
    goal_checker_id: general_goal_checker
    follow_path_action: /follow_path
    follow_slice_horizon_m: 30.0
    enable_controller_slice_freeze: true
    freeze_slice_topic: /controller_server/global_path_slice_freeze
    executing_freq_hz: 1.0
    path_max_interval: 0.5

controller_server:
  ros__parameters:
    use_sim_time: true
    cmd_vel_pause_topic: "/pause"
    odom_topic: /odom
    controller_frequency: 50.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 5.0
    progress_checker_plugin: "progress_checker"
    current_goal_checker: "general_goal_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.2
    FollowPath:
      plugin: "nav2_a_star_rpp::RegulatedPurePursuitController"
      prefer_planner_polyline_when_clear: true
      polyline_collision_check_resolution: 0.05
      polyline_track_max_length: 15.0
      publish_global_path_slice_freeze: true
      publish_merge_connection_point: true
      lookahead_distance: 1.0
      min_lookahead_distance: 0.5
      max_lookahead_distance: 2.0
      use_velocity_scaled_lookahead_distance: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      desired_linear_vel: 0.5
      min_linear_vel: 0.1
      max_linear_vel: 0.6
      max_angular_vel: 1.2
      min_angular_vel: 0.0
      acc_lim_linear: 0.8
      acc_lim_angular: 1.5
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      regulate_linear_vel: true
      allow_backward: false

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[ [0.35, 0.3], [0.35, -0.3], [-0.35, -0.3], [-0.35, 0.3] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        clear_before_update: false
        observation_sources: pointcloud
        min_obstacle_height: -100.0
        max_obstacle_height: 100.0
        pointcloud:
          topic: /livox/lidar
          obstacle_range: 7.1
          raytrace_range: 7.1
          min_obstacle_height: 0.2
          max_obstacle_height: 0.65
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: "PointCloud2"
          observation_keep_time: 0.0
      temporal_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        voxel_decay: 0.5
        decay_model: 0
        voxel_size: 0.1
        track_unknown_space: false
        observation_sources: pointcloud
        pointcloud:
          topic: /livox/lidar
          max_obstacle_height: 1.0
          min_obstacle_height: 0.3
          obstacle_range: 7.1
          raytrace_range: 7.1
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 1.0
      always_send_full_costmap: true
  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 10.0
    node_names: ['nav2_log_record', 'controller_server', 'waypoint_navigator']

nav2_input_bridge:
  ros__parameters:
    use_sim_time: false
    local_odom_topic: "/mavros/local_position/odom"
    reference_latitude: 30.8135718
    reference_longitude: 120.8338169
    reference_altitude: 12.318126322268082
    #reference_latitude: 30.7939518
    #reference_longitude: 120.8104288
    #reference_altitude: 12.07629405266946
    goal_input_topic: "/gp_goal"
    uav_goal_input_topic: "/uav/target_gps"
    goal_output_topic: "/goal_pose"
    goal_output_frame: "map"
    require_nav_sat_fix: true